name: MatrixOne e2e CI(Standalone)

on:
  workflow_call:
    inputs:
      bvt_group:
        description: "BVT group assigned by the caller (0 or 1)"
        required: false
        type: string
        default: ""
      bvt_generation:
        description: "Shared assignment generation for complementary BVT jobs"
        required: false
        type: string
        default: ""
      build_artifact:
        description: "Run-scoped artifact holding a shared -cover mo-service build; empty builds from source"
        required: false
        type: string
        default: ""
    secrets:
      TOKEN_ACTION:
        description: "Token for checkout (e.g. pull from fork/private)"
        required: false

jobs:
  bvt-linux-x86:
    if: false
    environment: ci
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-22.04' }}
    name: e2e BVT Test on Linux/x64(LAUNCH,Optimistic)
    timeout-minutes: 90
    steps:
      - name: checkout head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          fetch-depth: "3"
          path: ./head
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go And Java
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          go-version-file: "${{ github.workspace }}/head/go.mod"
      - name: Build MatrixOne
        run: |
          cd $GITHUB_WORKSPACE/head && make clean && make build
          git rev-parse --short HEAD
      - name: echo config
        run: |
          cd $GITHUB_WORKSPACE/head
          echo ""  >> ./etc/launch/cn.toml
          echo '[cn.txn]' >> ./etc/launch/cn.toml
          echo 'mode = "Optimistic"' >> ./etc/launch/cn.toml
          echo "  enable-leak-check = 1" >> ./etc/launch/cn.toml
          echo '  max-active-ages = "2m"'>> ./etc/launch/cn.toml
          echo ""  >> ./etc/launch/tn.toml
          echo '[tn.txn]' >> ./etc/launch/tn.toml
          echo 'mode = "Optimistic"' >> ./etc/launch/tn.toml
          cat ./etc/launch/cn.toml
          cat ./etc/launch/tn.toml
      - name: Start MO
        run: |
          cd $GITHUB_WORKSPACE/head
          ./optools/run_bvt.sh $GITHUB_WORKSPACE/head launch
      - name: Clone test-tool repository
        uses: actions/checkout@v6
        with:
          repository: matrixorigin/mo-tester
          path: ./mo-tester
          ref: main
      - name: Update BVT SQL Timeout
        run: |
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i "s/socketTimeout:.*/socketTimeout: 300000/g" mo.yml
      - name: Start BVT Test
        id: bvt_on_pr_version
        run: |
          export LC_ALL="C.UTF-8"
          locale
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i 's/  port: [0-9]*/  port: 12345/g' mo.yml
          cat mo.yml
          echo "============================="

          ./run.sh -n -g -o -p $GITHUB_WORKSPACE/head/test/distributed/cases -e pessimistic_transaction 2>&1
      - name: Dump mo-service goroutines
        if: ${{ always() && !cancelled() }}
        run: |
          max_retry=5
          retry=0
          while [ "$(ps -ef | grep 'mo-service' | grep -v "grep" | wc -l)" -gt 0 ]; do
            curl http://localhost:12345/debug/pprof/goroutine\?debug=2 -o ${{ github.workspace }}/head/dump-stacks${retry}.log
            pkill -9 mo-service
            retry=$((retry+1))
            if [ ${retry} -ge ${max_retry} ]; then
              echo 'after retry, still cannot shutdown mo-service'
              exit 1
            fi
            sleep 2
          done
      - name: Restart the Version of Head of MO
        run: |
          cd $GITHUB_WORKSPACE/head
          mv mo-service.log mo-service.r1.log

          # delete for clear the start finish status of mo
          rm -rf mo-data/local/system_init_completed

          ./optools/run_bvt.sh $GITHUB_WORKSPACE/head launch
      - name: Start BVT Test for MO with Version of Head Restarted
        id: bvt_on_latest_head_version_run2
        run: |
          export LC_ALL="C.UTF-8"
          locale
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i 's/  port: [0-9]*/  port: 12345/g' mo.yml
          cat mo.yml
          echo "============================="

          ./run.sh -n -g -o -p $GITHUB_WORKSPACE/head/test/distributed/cases -e pessimistic_transaction 2>&1
      - name: Dump restarted mo-service goroutines
        if: ${{ always() && !cancelled() }}
        run: |
          if [ "$(ps -ef | grep 'mo-service' | grep -v "grep" | wc -l)" -gt 0 ]; then curl http://localhost:12345/debug/pprof/goroutine\?debug=2 -o ${{ github.workspace }}/head/restarted-dump-stacks.log; pkill -9 mo-service; else echo 'current mo-service has already crashed'; exit 1; fi
      - name: Check Log Messages Count per second
        if: ${{ always() && !cancelled() }}
        run: |
          cd $GITHUB_WORKSPACE/head
          # 4 nodes in one Process
          ./optools/check_log_count.sh 4000 60 # {count threshold} {metric collected interval}
      - name: generate upload files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set +e
          mkdir -p ${{ github.workspace }}/upload
          rm -rf ./mo-tester/.git
          rm -rf ./mo-tester/lib
          mv ${{ github.workspace }}/head/mo-service.r1.log ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/head/mo-service.log ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/mo-tester ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/head/dump-stacks* ${{ github.workspace }}/upload/
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled()}}
        continue-on-error: true
        with:
          name: Standalone-e2e-BVT-Test-on-Linux-x64(LAUNCH,Optimistic)-reports
          path: |
            ${{ github.workspace }}/upload
          retention-days: 7
      - uses: actions/upload-artifact@v7
        name: Upload MO DATA
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: Standalone-e2e-BVT-Test-on-Linux-x64(LAUNCH,Optimistic)-mo-data
          path: |
            ${{ github.workspace }}/head/mo-data
          retention-days: 7

  multi-cn-proxy-bvt-linux-x86:
    # Compose + Proxy is the active proxy coverage deployment. Keep the
    # native proxy launcher out of the PR matrix until it has a distinct role.
    if: false
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-22.04' }}
    name: Legacy Launch + Proxy BVT (disabled in parallel workflow)
    timeout-minutes: 75
    env:
      mo_reuse_enable_checker: true
    steps:
      - name: checkout head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          path: ./head
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go And Java
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          go-version-file: "${{ github.workspace }}/head/go.mod"
      - name: Build MatrixOne
        run: |
          cd $GITHUB_WORKSPACE/head && make clean && make build
          git rev-parse --short HEAD
      - name: Prepare Hosts
        run: |
          sudo bash -c 'echo -e "127.0.0.1\tcn0" >> /etc/hosts;';
          sudo bash -c 'echo -e "127.0.0.1\tcn1" >> /etc/hosts;';
      - name: Add cn.txn
        run: |
          cd $GITHUB_WORKSPACE/head
          echo "" >> ./etc/launch-dynamic-with-proxy/cn.toml.base
          echo "" >> ./etc/launch-dynamic-with-proxy/cn.toml.base
          echo "[cn.txn]" >> ./etc/launch-dynamic-with-proxy/cn.toml.base
          echo "  enable-leak-check = 1" >> ./etc/launch-dynamic-with-proxy/cn.toml.base
          echo '  max-active-ages = "2m"'>> ./etc/launch-dynamic-with-proxy/cn.toml.base
      - name: Start MO
        run: |
          sudo cat /etc/hosts | grep '127.0.0.1';
          cd $GITHUB_WORKSPACE/head
          ./optools/run_bvt.sh $GITHUB_WORKSPACE/head launch-dynamic-with-proxy -with-proxy
      - name: Clone test-tool repository
        uses: actions/checkout@v6
        with:
          repository: matrixorigin/mo-tester
          path: ./mo-tester
          ref: main
      - name: Update BVT SQL Timeout
        run: |
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i "s/socketTimeout:.*/socketTimeout: 300000/g" mo.yml
      - name: Start BVT Test
        id: bvt_on_pr_version
        run: |
          export LC_ALL="C.UTF-8"
          locale
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i 's/  port: [0-9]*/  port: 12345/g' mo.yml
          cat mo.yml
          echo "============================="

          ./run.sh -n -g -o -p $GITHUB_WORKSPACE/head/test/distributed/cases -e optimistic 2>&1
      - name: Dump mo-service goroutines
        if: ${{ always() && !cancelled() }}
        run: |
          if [ "$(ps -ef | grep 'mo-service' | grep -v "grep" | wc -l)" -gt 0 ]; then curl http://localhost:12345/debug/pprof/goroutine\?debug=2 -o ${{ github.workspace }}/head/dump-stacks.log; else echo 'current mo-service has already crashed'; exit 1; fi
      - name: Check Log Messages Count per second
        if: ${{ always() && !cancelled() }}
        run: |
          cd $GITHUB_WORKSPACE/head
          # one node in one Process
          ./optools/check_log_count.sh 1000 60 # {count threshold} {metric collected interval}
      - name: generate upload files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/upload
          rm -rf ./mo-tester/.git
          rm -rf ./mo-tester/lib
          mv ${{ github.workspace }}/head/mo-service.log ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/mo-tester ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/head/dump-stacks.log ${{ github.workspace }}/upload/
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled()}}
        continue-on-error: true
        with:
          name: Standalone-Multi-CN-e2e-BVT-Test-on-Linux-x64(LAUNCH,PROXY)-reports
          path: |
            ${{ github.workspace }}/upload
          retention-days: 7

  pessimistic-bvt-linux-x86:
    # Match the existing PR BVT runner policy.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-22.04' }}
    name: multi CN e2e BVT Test on Linux/x64(COMPOSE, PESSIMISTIC)
    timeout-minutes: 75
    env:
      mo_reuse_enable_checker: true
    steps:
      - name: Pre Clean Some Unneeded Images
        run: |
          sudo df -h /*
          sudo docker builder prune -f -a
          sudo docker images | grep -v REPOSITORY | awk '{system("sudo docker rmi "$1":"$2)}'
          sudo docker volume prune -f
          sudo df -h /*

      - name: checkout head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          fetch-depth: "3"
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go And Java
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          go-version-file: "${{ github.workspace }}/go.mod"

      - name: Print run attempt
        run: echo "run attempt is ${{ github.run_attempt }}"

      - name: Download shared MatrixOne build
        if: ${{ inputs.build_artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/mo-prebuilt

      - name: Print Disk Usage Before Container Start
        if: ${{ always() }}
        run: |
          set +e
          sudo df -h /*
          sudo du -hs /var/lib/docker
          sudo docker system df -v

      # The native launch build regularly exceeds this job's timeout. Run its
      # complementary BVT case group on the same compose topology as the
      # proxy job; the assigned case group is the only test difference.
      - name: Launch multi-CN compose
        timeout-minutes: 10
        run: |
          cat ./etc/launch-tae-compose/config/cn-0.toml
          cat ./etc/launch-tae-compose/config/cn-1.toml
          cat ./etc/launch-tae-compose/config/tn.toml
          sed -i 's|:/test\b|:'"$GITHUB_WORKSPACE"'/test|g' ./etc/launch-tae-compose/compose.yaml
          mkdir -p "$GITHUB_WORKSPACE/coverage" "$GITHUB_WORKSPACE/docker-compose-log"

          # Assemble the runtime image from the shared -cover build when the
          # run provides one; otherwise (or on any mismatch/failure) fall back
          # to the full in-docker build.
          image_built=0
          prebuilt_tar="${RUNNER_TEMP}/mo-prebuilt/mo-build.tar.gz"
          if [ -s "${prebuilt_tar}" ] && [ -f ./optools/images/Dockerfile.prebuilt ]; then
            ctx="${RUNNER_TEMP}/mo-image-ctx"
            rm -rf "${ctx}" && mkdir -p "${ctx}"
            if ! tar -xzf "${prebuilt_tar}" -C "${ctx}"; then
              echo "::warning::shared build artifact failed to extract; falling back to full docker build"
              rm -rf "${ctx}" && mkdir -p "${ctx}"
            fi
            prebuilt_sha=$(sed -n 's/^head_sha=//p' "${ctx}/BUILD_INFO" 2>/dev/null || true)
            prebuilt_opt=$(sed -n 's/^gobuild_opt=//p' "${ctx}/BUILD_INFO" 2>/dev/null || true)
            if [ "${prebuilt_sha}" = '${{ github.event.pull_request.head.sha }}' ] \
              && [ "${prebuilt_opt}" = '-cover' ]; then
              cp -r ./etc "${ctx}/etc"
              if docker build -t matrixorigin/matrixone:latest \
                -f ./optools/images/Dockerfile.prebuilt "${ctx}"; then
                image_built=1
                echo "Using shared prebuilt mo-service (${prebuilt_sha})"
              else
                echo "::warning::prebuilt image assembly failed; falling back to full docker build"
              fi
            else
              echo "::warning::shared build mismatch (sha=${prebuilt_sha}, opt=${prebuilt_opt}); falling back to full docker build"
            fi
          fi
          if [ "${image_built}" != "1" ]; then
            docker build --build-arg GOBUILD_OPT=-cover -t matrixorigin/matrixone:latest . -f ./optools/images/Dockerfile
          fi
          docker compose -f etc/launch-tae-compose/compose.yaml --profile launch-multi-cn up -d
          i=1
          while [ $(mysql -h 127.0.0.1 -P 6001 -u dump -p111 --execute 'create database if not exists compose_test;use compose_test; create table if not exists compose_test_table(col1 int auto_increment primary key);show tables;' 2>&1 | tee /dev/stderr | grep 'compose_test_table' | wc -l) -lt 1 ]; do
            echo "wait mo init finished...$i"
            if [ $i -ge 300 ]; then
              echo '::error::multi-CN compose did not become ready'
              docker ps
              exit 1
            fi
            i=$((i+1))
            sleep 1
          done
          docker ps

      - name: Print Disk Usage After Container Start
        if: ${{ always() }}
        run: |
          set +e
          sudo df -h /*
          sudo du -hs /var/lib/docker
          sudo docker system df -v

      - name: Clean Docker Image Build Cache
        if: ${{ always() }}
        run: |
          sudo docker builder prune -f -a
          sudo docker system df -v

      - name: Clone test-tool repository
        uses: actions/checkout@v6
        with:
          repository: matrixorigin/mo-tester
          path: ./mo-tester
          ref: main
      - name: Update BVT SQL Timeout
        run: |
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i "s/socketTimeout:.*/socketTimeout: 300000/g" mo.yml
      - name: Start BVT Test
        id: bvt_on_pr_version
        run: |
          export LC_ALL="C.UTF-8"
          locale
          cd "$GITHUB_WORKSPACE/mo-tester"
          sed -i 's/  port: [0-9]*/  port: 12345/g' mo.yml
          cat mo.yml
          echo "============================="

          bvt_group='${{ inputs.bvt_group }}'
          bvt_generation='${{ inputs.bvt_generation }}'
          if [ -z "${bvt_group}" ]; then
            bvt_group=$(( 1 - ((${{ github.run_id }} + ${{ github.run_attempt }}) % 2) ))
          fi
          if [ -z "${bvt_generation}" ]; then
            bvt_generation='${{ github.run_id }}-${{ github.run_attempt }}'
          fi
          if [[ ! "${bvt_group}" =~ ^[01]$ ]] || [ -z "${bvt_generation}" ]; then
            echo "::error::invalid BVT assignment: group=${bvt_group}, generation=${bvt_generation}"
            exit 1
          fi
          echo "bvt_group=${bvt_group}" >> "$GITHUB_OUTPUT"
          echo "bvt_generation=${bvt_generation}" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg deployment 'compose-pessimistic' \
            --argjson group "${bvt_group}" \
            --arg generation "${bvt_generation}" \
            --arg head_sha '${{ github.event.pull_request.head.sha }}' \
            '{schema_version: 1, deployment: $deployment, group: $group, generation: $generation, head_sha: $head_sha}' \
            > "${RUNNER_TEMP}/bvt-pessimistic-manifest.json"
          echo "Compose multi-CN BVT: generation ${bvt_generation}, group ${bvt_group}"
          {
            echo "### BVT group assignment"
            echo "- Deployment: compose multi-CN"
            echo "- Group: ${bvt_group}"
            echo "- Generation: ${bvt_generation}"
          } >> "$GITHUB_STEP_SUMMARY"
          cd "$GITHUB_WORKSPACE"
          set -o pipefail
          bvt_runner="$GITHUB_WORKSPACE/optools/run_bvt_group.sh"
          if [ ! -f "${bvt_runner}" ]; then
            bvt_runner="${RUNNER_TEMP}/run_bvt_group.sh"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/matrixorigin/matrixone/7cb78aa5f88e3b98163f6b3bffb5f71586c0cbbf/optools/run_bvt_group.sh" \
              --output "${bvt_runner}"
          fi
          bash "${bvt_runner}" \
            "$GITHUB_WORKSPACE/mo-tester" \
            "$GITHUB_WORKSPACE/test/distributed/cases" \
            "${bvt_group}" \
            "$GITHUB_WORKSPACE/test/distributed/resources" \
            2>&1 | tee "${RUNNER_TEMP}/bvt-pessimistic.log"

      - name: Summarize Compose + Pessimistic BVT result
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/bvt-pessimistic.log"
          timing="${RUNNER_TEMP}/bvt-pessimistic-slowest.tsv"
          if [ ! -s "${report}" ]; then
            echo '### Compose + Pessimistic BVT result' | tee -a "$GITHUB_STEP_SUMMARY"
            echo '- No BVT execution log was produced.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Compose + Pessimistic BVT result'
            grep '^Run BVT group' "${report}" | sed 's/^/- /' || true
            echo
            echo '#### Top 10 slow BVT scripts'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

          sed -nE 's#.*script file\[(.*)\] has been executed, and cost: ([0-9.]+)s.*#\2s\t\1#p' "${report}" \
            | sort -nr -k1,1 | awk 'NR <= 10 { print }' > "${timing}"
          if [ ! -s "${timing}" ]; then
            echo 'No per-script timing records found in BVT output.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '```text'
            cat "${timing}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Compose + Pessimistic BVT execution log
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bvt-execution-pessimistic
          path: ${{ runner.temp }}/bvt-pessimistic.log
          if-no-files-found: warn
          retention-days: 7

      - name: Print Docker Info Before Container Shutdown
        if: ${{ always() }}
        run: |
          set +e
          sudo docker ps
          sudo df -h /*
          sudo du -hs /var/lib/docker
          sudo docker system df -v

      - name: Print System Dmesg
        if: ${{ always() }}
        continue-on-error: true
        run: sudo dmesg -T

      - name: Dump mo-service goroutines
        if: ${{ always() && !cancelled() }}
        run: |
          curl --fail http://localhost:12345/debug/pprof/goroutine\?debug=2 -o "$GITHUB_WORKSPACE/docker-compose-log/cn-0-dump-stacks.log" || true
          curl --fail http://localhost:22345/debug/pprof/goroutine\?debug=2 -o "$GITHUB_WORKSPACE/docker-compose-log/cn-1-dump-stacks.log" || true

      - name: Check Log Messages Count per second
        if: ${{ always() && !cancelled() }}
        run: |
          ./optools/check_log_count.sh 1000 60 # {count threshold} {metric collected interval}

      - name: shutdown containers
        if: ${{ always() }}
        run: |
          docker ps
          docker compose -f etc/launch-tae-compose/compose.yaml --profile launch-multi-cn down --remove-orphans
          docker volume rm launch-tae-compose_minio_storage || true

      - name: Generate Compose BVT coverage profile
        if: ${{ always() && !cancelled() }}
        run: |
          set -uo pipefail
          coverage_dir="$GITHUB_WORKSPACE/coverage"
          coverage_profile="${RUNNER_TEMP}/bvt-pessimistic.out"
          compose_file="$GITHUB_WORKSPACE/etc/launch-tae-compose/compose.yaml"
          if ! grep -Eq 'GOCOVERDIR=/coverage' "${compose_file}" \
            || ! grep -Eq 'coverage:/coverage' "${compose_file}"; then
            echo '::warning::Compose BVT coverage is unsupported by this legacy branch; keeping the successful BVT result'
            exit 0
          fi
          if go tool covdata textfmt -i="${coverage_dir}" -o "${coverage_profile}"; then
            test -s "${coverage_profile}"
          elif [ "${{ steps.bvt_on_pr_version.conclusion }}" = "success" ]; then
            echo '::error::failed to generate Compose + Pessimistic BVT coverage after a successful BVT'
            exit 1
          else
            echo '::warning::Compose + Pessimistic BVT coverage unavailable because BVT did not finish successfully'
          fi

      - name: Upload Compose + Pessimistic BVT coverage
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bvt-coverage-pessimistic-generation-${{ steps.bvt_on_pr_version.outputs.bvt_generation || format('{0}-{1}', github.run_id, github.run_attempt) }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bvt-pessimistic.out
            ${{ runner.temp }}/bvt-pessimistic-manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: generate upload files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/upload
          if [ -d "${{ github.workspace }}/mo-tester" ]; then
            rm -rf ./mo-tester/.git
            rm -rf ./mo-tester/lib
            mv ${{ github.workspace }}/mo-tester ${{ github.workspace }}/upload/
          fi
          if [ -d "${{ github.workspace }}/docker-compose-log" ]; then
            mv ${{ github.workspace }}/docker-compose-log ${{ github.workspace }}/upload/
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled()}}
        continue-on-error: true
        with:
          name: Compose-multi-CN-e2e-BVT-Test-on-Linux-x64(PESSIMISTIC)-reports
          path: |
            ${{ github.workspace }}/upload
            ${{ github.workspace }}/docker-compose-log
          retention-days: 7
